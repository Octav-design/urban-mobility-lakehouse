resources:
  jobs:
    urban_mobility_medallion_pipeline:
      name: urban-mobility-medallion-pipeline

      description: >
        Automated medallion pipeline for NYC taxi data:
        source discovery, Bronze ingestion, Silver data quality,
        and Gold analytical aggregations.

      max_concurrent_runs: 1

      queue:
        enabled: true

      parameters:
        - name: taxi_type
          default: yellow

      tasks:
        - task_key: resolve_period
          description: Find the latest published and unprocessed source period.
          notebook_task:
            notebook_path: ../notebooks/00_resolve_period.ipynb
            base_parameters:
              taxi_type: "{{job.parameters.taxi_type}}"
          max_retries: 2
          min_retry_interval_millis: 60000
          retry_on_timeout: true
          timeout_seconds: 600

        - task_key: new_data_available
          description: Continue only when a new source period is available.
          depends_on:
            - task_key: resolve_period
          condition_task:
            op: EQUAL_TO
            left: "{{tasks.resolve_period.values.should_process}}"
            right: "true"

        - task_key: bronze_ingestion
          description: Download and validate the raw Parquet source.
          depends_on:
            - task_key: new_data_available
              outcome: "true"
          notebook_task:
            notebook_path: ../notebooks/01_bronze_ingestion.ipynb
            base_parameters:
              taxi_type: "{{job.parameters.taxi_type}}"
              year: "{{tasks.resolve_period.values.year}}"
              month: "{{tasks.resolve_period.values.month}}"
              force_reload: "false"
          max_retries: 2
          min_retry_interval_millis: 60000
          retry_on_timeout: true
          timeout_seconds: 1800

        - task_key: silver_transformation
          description: Standardize, validate, quarantine, and deduplicate trips.
          depends_on:
            - task_key: bronze_ingestion
          notebook_task:
            notebook_path: ../notebooks/02_silver_transformation.ipynb
            base_parameters:
              taxi_type: "{{job.parameters.taxi_type}}"
              year: "{{tasks.resolve_period.values.year}}"
              month: "{{tasks.resolve_period.values.month}}"
          max_retries: 1
          min_retry_interval_millis: 60000
          retry_on_timeout: true
          timeout_seconds: 2700

        - task_key: gold_aggregations
          description: Produce daily, hourly, and monthly analytical tables.
          depends_on:
            - task_key: silver_transformation
          notebook_task:
            notebook_path: ../notebooks/03_gold_aggregations.ipynb
            base_parameters:
              taxi_type: "{{job.parameters.taxi_type}}"
              year: "{{tasks.resolve_period.values.year}}"
              month: "{{tasks.resolve_period.values.month}}"
          max_retries: 1
          min_retry_interval_millis: 60000
          retry_on_timeout: true
          timeout_seconds: 2700

      schedule:
        quartz_cron_expression: "0 0 9 15 * ?"
        timezone_id: Europe/Bucharest
        pause_status: PAUSED